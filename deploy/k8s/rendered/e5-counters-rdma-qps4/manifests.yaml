apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: compass-e5-counters-rdma-qps4-gpus
  namespace: compass
  labels: {app.kubernetes.io/part-of: compass, compass/run-id: "e5-counters-rdma-qps4"}
spec:
  spec:
    devices:
      requests:
        - name: gpus
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: ExactCount
            count: 4

---
# The dranet claim. IPVLAN keeps the rail VF on the host and gives the pod a child interface;
# in the host's SHARED RDMA netns mode the RDMA device is visible too and the driver injects
# its /dev/infiniband char devices. acceptRA=1 lets the kernel autoconfigure the child from the
# fabric's router advertisements (the fork's driver-side SLAAC wait exists for passthrough only).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: compass-e5-counters-rdma-qps4-rails
  namespace: compass
  labels: {app.kubernetes.io/part-of: compass, compass/run-id: "e5-counters-rdma-qps4"}
spec:
  spec:
    devices:
      requests:
        - name: rails
          exactly:
            deviceClassName: dra.net
            allocationMode: ExactCount
            count: 4
            selectors:
              - cel:
                  expression: >-
                    has(device.attributes["dra.net"].rdma) && device.attributes["dra.net"].rdma == true &&
                    has(device.attributes["dra.net"].ifName) && device.attributes["dra.net"].ifName.startsWith("rdma_vf_rail")
      config:
        - requests: [rails]
          opaque:
            driver: dra.net
            parameters:
              interface:
                type: IPVLAN
                addressing: Unnumbered
                acceptRA: 1
                ipvlan: {mode: L2, flag: Bridge}

---
# e5-counters-rdma-qps4 — E5 allreduce over rdma (2 pod(s) x 4 rank(s), rails=4)
# Rendered from deploy/k8s/matrix.yaml by render.py; do not edit by hand.
apiVersion: v1
kind: Service
metadata:
  name: compass-e5-counters-rdma-qps4
  namespace: compass
  labels: {app.kubernetes.io/part-of: compass, compass/run-id: "e5-counters-rdma-qps4"}
spec:
  clusterIP: None
  selector: {app: compass-e5-counters-rdma-qps4}
  ports:
    - {name: rendezvous, port: 29500}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: compass-e5-counters-rdma-qps4
  namespace: compass
  labels: {app.kubernetes.io/part-of: compass, compass/run-id: "e5-counters-rdma-qps4", compass/experiment: "E5"}
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  activeDeadlineSeconds: 1500
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app: compass-e5-counters-rdma-qps4, app.kubernetes.io/part-of: compass, compass/run-id: "e5-counters-rdma-qps4"}
    spec:
      restartPolicy: Never
      subdomain: compass-e5-counters-rdma-qps4
      runtimeClassName: nvidia
      nodeSelector:
        k8s-bootstrap.io/role: worker
      imagePullSecrets:
        - name: compass-quay-pull
      resourceClaims:
        - name: gpus
          resourceClaimTemplateName: compass-e5-counters-rdma-qps4-gpus
        - name: rails
          resourceClaimTemplateName: compass-e5-counters-rdma-qps4-rails
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: compass-e5-counters-rdma-qps4}
              topologyKey: kubernetes.io/hostname
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 32Gi}
        - name: results
          hostPath: {path: /mnt/localdisk/compass-results, type: DirectoryOrCreate}
      containers:
        - name: bench
          image: quay.io/drkennetz/ktlo-labs:compass-latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities: {add: [IPC_LOCK]}   # pin RDMA memory (ibv_reg_mr) without privilege
          resources:
            claims:
              - name: gpus
              - name: rails
            limits: {memory: 64Gi}
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: results, mountPath: /results}
          env:
            - name: NODE_RANK
              valueFrom: {fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: NNODES, value: "2"}
            - {name: NPROC_PER_NODE, value: "4"}
            - {name: MASTER_ADDR, value: compass-e5-counters-rdma-qps4-0.compass-e5-counters-rdma-qps4}
            - {name: MASTER_PORT, value: "29500"}
            - {name: RUN_ID, value: "e5-counters-rdma-qps4"}
            - {name: REPEAT, value: "0"}
            - {name: IMAGE_REF, value: "quay.io/drkennetz/ktlo-labs:compass-latest"}
            - {name: RESULTS_DIR, value: /results}
            - {name: EXPECT_HCAS, value: "4"}
            - {name: VARIANT_JSON, value: "{\"label\": \"counters\", \"rails\": 4, \"transport\": \"rdma\"}"}
            - {name: NCCL_DEBUG, value: "INFO"}
            - {name: NCCL_DEBUG_SUBSYS, value: "INIT,GRAPH,NET"}
            - {name: NCCL_CUMEM_ENABLE, value: "1"}
            - {name: NCCL_SOCKET_IFNAME, value: "eth0"}
            - {name: NCCL_MNNVL_ENABLE, value: "0"}
            - {name: NCCL_IB_HCA, value: "rdma_vf_rail"}
            - {name: NCCL_NET_GDR_C2C, value: "1"}
            - {name: NCCL_NET_GDR_LEVEL, value: "SYS"}
            - {name: NCCL_IB_QPS_PER_CONNECTION, value: "4"}
            - {name: NCCL_IB_SPLIT_DATA_ON_QPS, value: "1"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -o pipefail
              echo "=== ${RUN_ID} node_rank=${NODE_RANK} on ${NODE_NAME} ==="
              echo "GPUs visible : $(nvidia-smi -L | grep -c '^GPU')"
              echo "IMEX channels: $(ls /dev/nvidia-caps-imex-channels/ 2>/dev/null | tr '\n' ' ')"
              echo "RDMA devices : $(ls /sys/class/infiniband/ 2>/dev/null | tr '\n' ' ')"
              echo "interfaces   :"; ip -br addr | sed 's/^/  /'
              vis=$(nvidia-smi -L | grep -c '^GPU')
              [ "$vis" -eq "${NPROC_PER_NODE}" ] || { echo "PRECHECK-FAILED: claim yielded ${vis} GPU(s), expected ${NPROC_PER_NODE}"; exit 3; }
              # In shared RDMA netns mode sysfs lists every host rail; only the claimed ones have
              # their uverbs char device in this pod. NCCL gets exactly those.
              hcas=$(python -m bench gid --list-hcas || true)
              n=$(echo "$hcas" | tr ',' '\n' | grep -c .)
              [ "$n" -eq "${EXPECT_HCAS}" ] || { echo "PRECHECK-FAILED: ${n} usable rdma_vf_rail* device(s) (${hcas}), expected ${EXPECT_HCAS}"; exit 3; }
              export NCCL_IB_HCA="=${hcas}"
              # The IPVLAN children autoconfigure from router advertisements; a fresh pod may only
              # hold link-local addresses for a while. Solicit the router on each rail and wait for a
              # global address (the RoCE v2 GID NCCL needs) instead of racing the next periodic RA.
              for i in $(seq 1 60); do
                missing=""
                for dev in $(echo "$hcas" | tr ',' ' '); do
                  ip -6 addr show dev "$dev" scope global 2>/dev/null | grep -q inet6 || { missing="$missing $dev"; rdisc6 -1 -q -w 1000 "$dev" >/dev/null 2>&1 || true; }
                done
                [ -z "$missing" ] && break
                sleep 2
              done
              [ -z "$missing" ] || { echo "PRECHECK-FAILED: no global IPv6 address after 2 min on:${missing}"; ip -6 addr; exit 3; }
              ip -6 -br addr show scope global | grep rdma_vf | sed 's/^/  /'
              # The RoCE v2 GID index is DISCOVERED from the GID table, never assumed (see bench/gid.py).
              python -m bench gid || true
              gid_export=$(python -m bench gid --export --wait 60) || { echo "PRECHECK-FAILED: no consistent global RoCE v2 GID index across ${hcas}"; exit 3; }
              eval "$gid_export"
              echo "NCCL_IB_HCA=${NCCL_IB_HCA} NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX}"
              python -m bench sysinfo > /results/${RUN_ID}.sysinfo.${NODE_RANK}.json 2>/dev/null || true
              exec torchrun --nnodes=${NNODES} --nproc_per_node=${NPROC_PER_NODE} --node_rank=${NODE_RANK} \
                --master_addr=${MASTER_ADDR} --master_port=${MASTER_PORT} \
                -m bench allreduce --run-id "${RUN_ID}" --repeat "${REPEAT}" --experiment E5 --sizes 4Gi --iters 400 --warmup 10
