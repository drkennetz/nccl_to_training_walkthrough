# platform/gpu-operator/values-dra.yaml -- OPT-IN overlay: Dynamic Resource Allocation.
#
# Applied ON TOP of values.yaml with a second -f. It flips the operator from the
# device-plugin stack to the DRA stack. The chart is explicit that these are
# mutually exclusive: "It is an invalid configuration for both CRs to exist."
#
#   bin/k8s-gpu --dra          install with this overlay
#
# NVIDIA labels the GPUCluster/DRA stack EXPERIMENTAL in this chart version
# (v26.7.0, DRA driver v0.5.0). DRA itself is GA as of Kubernetes 1.34, so the
# API is stable; the NVIDIA driver on top of it is what is new.
#
# With this overlay, pods stop requesting `nvidia.com/gpu` and instead reference a
# ResourceClaim against the `gpu.nvidia.com` DeviceClass. Existing manifests that
# request nvidia.com/gpu will NOT schedule.

clusterPolicy:
  deployCR: false
gpuCluster:
  deployCR: true

draDriver:
  # Pinned via versions.env (NVIDIA_DRA_DRIVER_VERSION); kept here because the
  # chart takes it as a plain value.
  version: v0.5.0

  # GPU allocation through DRA. This is the part we actually want to exercise and
  # it needs nothing from the host beyond CDI, which containerd 2.x already has.
  gpus: {}

  computeDomains:
    # OFF, and this is the important line in the file.
    #
    # ComputeDomain is NVIDIA's multi-node-NVLink mechanism, and enabling it
    # requires `systemctl disable --now nvidia-imex && systemctl mask nvidia-imex`
    # on every node -- masking a provider-managed daemon that currently gives
    # Slurm users their NVLink domains. That is Path B, it mutates host state,
    # and it is never the default here. See the IMEX section of CLAUDE.md.
    #
    # The chart defaults this to TRUE, so it must be explicitly disabled.
    enabled: false
