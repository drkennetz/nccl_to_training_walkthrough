# workloads/plumbing/08-nccl-4x4.yaml -- full-scale NCCL: 4 GPUs x 2 nodes = 8 ranks.
#
# REQUIRES DEVICE-PLUGIN MODE. This requests `limits: nvidia.com/gpu`, which does not
# exist under `bin/k8s-gpu --dra` -- the pod stays Pending with `Insufficient
# nvidia.com/gpu` no matter how many nodes you add. On DRA use
# workloads/plumbing/09-nccl-4x4-dra.yaml, or switch back with `bin/k8s-gpu`.
#
# Gate 07 proves cross-node NVLink works at all, using ONE GPU per pod. This uses
# every GPU on both trays, which exercises two things 07 does not:
#
#   - intra-node NVLink between the 4 GPUs inside a tray, and
#   - cross-node MNNVL, simultaneously, in one 8-rank communicator.
#
# On a GB300 NVL72 rack both are the same fabric, so NCCL should report a single
# logical node (nNodes 1, localRanks 8) with every pair reachable via P2P/MNNVL.
# That collapse is the interesting result: from NCCL's point of view two trays in
# a clique are indistinguishable from one very large node.
#
#   kubectl apply -f workloads/plumbing/08-nccl-4x4.yaml
#   kubectl wait --for=condition=complete job/nccl-4x4 --timeout=900s
#   kubectl logs job/nccl-4x4 -l batch.kubernetes.io/job-completion-index=0
#
# One pod per node, four ranks per pod, driven by torchrun. torchrun owns local
# rank assignment and each rank binds cuda:LOCAL_RANK, so the pod's 4 allocated
# GPUs are all actually used -- gate 07 requested 4 and used 1.
---
apiVersion: v1
kind: Service
metadata:
  name: nccl-4x4
spec:
  clusterIP: None
  selector: {app: nccl-4x4}
  ports:
    - {name: rendezvous, port: 29400}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nccl-4x4
  labels: {app: k8s-bootstrap-plumbing, gate: nccl-4x4}
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels: {app: nccl-4x4}
      annotations:
        # Same three-part mechanism as gate 07; see CLAUDE.md. Without the
        # containerd annotation allowlist this is silently ignored and NCCL
        # reports "MNNVL is available but not working on this system".
        cdi.k8s.io/imex: "nvidia.com/imex-channel=all"
    spec:
      restartPolicy: Never
      subdomain: nccl-4x4
      runtimeClassName: nvidia
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        k8s-bootstrap.io/role: worker
      affinity:
        podAntiAffinity:
          # Hard, so the 8 ranks cannot all end up on one tray -- which would
          # still "pass" while proving nothing about cross-node traffic.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: nccl-4x4}
              topologyKey: kubernetes.io/hostname
      volumes:
        # NCCL needs real shared memory for its intra-node transport; the default
        # 64MiB /dev/shm is not enough for 4 local ranks.
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 32Gi}
      containers:
        - name: nccl
          image: nvcr.io/nvidia/pytorch:25.08-py3
          resources:
            limits:
              nvidia.com/gpu: 4      # all four, and all four get used
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
          env:
            - name: NODE_RANK
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: MASTER_ADDR
              value: nccl-4x4-0.nccl-4x4
            - name: MASTER_PORT
              value: "29400"
            - name: NCCL_DEBUG
              value: INFO
            - name: NCCL_DEBUG_SUBSYS
              value: INIT,GRAPH
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -o pipefail
              echo "=== node_rank ${NODE_RANK} on ${NODE_NAME} ==="
              echo "GPUs visible : $(nvidia-smi -L | grep -c '^GPU')"
              echo "IMEX channels: $(ls /dev/nvidia-caps-imex-channels/ 2>/dev/null | tr '\n' ' ')"
              echo "clique       : $(nvidia-smi -q | awk '/CliqueId/{print $NF}' | sort -u | paste -sd,)"
              echo "/dev/shm     : $(df -h /dev/shm | tail -1 | awk '{print $2}')"
              echo

              cat > /tmp/ar44.py <<'PY'
              import json, os, socket, time
              import torch, torch.distributed as dist

              local = int(os.environ["LOCAL_RANK"])
              torch.cuda.set_device(local)
              dist.init_process_group("nccl")
              rank, world = dist.get_rank(), dist.get_world_size()

              # Who is where: proves the communicator really spans two machines.
              me = {"rank": rank, "local_rank": local, "host": socket.gethostname(),
                    "gpu": torch.cuda.get_device_name(local)}
              everyone = [None] * world
              dist.all_gather_object(everyone, me)

              # 512MiB of bf16 per rank.
              n = 512 * 1024 * 1024 // 2
              x = torch.ones(n, dtype=torch.bfloat16, device="cuda")
              for _ in range(5):
                  dist.all_reduce(x)
              torch.cuda.synchronize(); dist.barrier()

              iters = 20
              t0 = time.perf_counter()
              for _ in range(iters):
                  dist.all_reduce(x)
              torch.cuda.synchronize()
              dt = (time.perf_counter() - t0) / iters

              nbytes = x.numel() * x.element_size()
              busbw = nbytes * 2 * (world - 1) / world / dt / 1e9

              # Correctness on a FRESH tensor: x has been summed in place 25 times
              # by now, so it holds world**25, not world. (Gate 07 got this wrong
              # and failed a working run.)
              y = torch.ones(4096, dtype=torch.bfloat16, device="cuda")
              dist.all_reduce(y)
              ok = bool(torch.all(y == world).item())

              # Aggregate over every rank. Each pod's torchrun only captures the
              # stdout of ITS OWN 4 ranks, so counting "correct=True" lines in one
              # pod's log can never reach 8 -- that mistake failed a run where all
              # 8 ranks were fine at 697 GB/s.
              flags = [None] * world
              dist.all_gather_object(flags, ok)
              all_ok = all(bool(f) for f in flags)

              if rank == 0:
                  hosts = sorted({e["host"] for e in everyone})
                  print("TOPO " + json.dumps({
                      "world_size": world,
                      "n_hosts": len(hosts),
                      "hosts": hosts,
                      "ranks_per_host": {h: sum(1 for e in everyone if e["host"] == h) for h in hosts},
                      "gpu": everyone[0]["gpu"],
                  }), flush=True)
                  print("PERF " + json.dumps({
                      "bytes_per_rank": nbytes,
                      "seconds": round(dt, 6),
                      "algbw_GBs": round(nbytes / dt / 1e9, 2),
                      "busbw_GBs": round(busbw, 2),
                  }), flush=True)
                  print("VALIDATION " + json.dumps({
                      "ranks_ok": sum(1 for f in flags if f),
                      "world_size": world,
                      "all_ok": all_ok,
                  }), flush=True)
              print("RANK%d correct=%s host=%s local_rank=%d" % (rank, ok, me["host"], local), flush=True)
              dist.destroy_process_group()
              PY

              torchrun \
                --nnodes=2 --nproc_per_node=4 --node_rank="${NODE_RANK}" \
                --master_addr="${MASTER_ADDR}" --master_port="${MASTER_PORT}" \
                /tmp/ar44.py 2>&1 | tee /tmp/out.txt
              rc=$?

              # Only node_rank 0 makes the assertions; rank 1 just has to exit 0.
              if [ "${NODE_RANK}" != "0" ]; then
                [ "$rc" = 0 ] && { echo "NODE1-OK"; exit 0; } || { echo "NODE1-FAILED"; exit 1; }
              fi

              echo
              echo "=== topology NCCL built ==="
              grep -oE "nRanks [0-9]+ nNodes [0-9]+ localRanks [0-9]+.*MNNVL [0-9]" /tmp/out.txt | sort -u | head -3 | sed 's/^/  /'
              echo "  P2P/MNNVL channels: $(grep -c 'via P2P/MNNVL' /tmp/out.txt || true)"
              echo "  NET/Socket in data path: $(grep -c 'via NET/Socket' /tmp/out.txt || true)"

              [ "$rc" = 0 ] || { echo "NCCL-4x4-FAILED: torchrun exited ${rc}"; exit 1; }
              # Rank 0 all_gathers every rank's verdict, so one line covers all 8.
              grep -q '"all_ok": true' /tmp/out.txt \
                || { echo "NCCL-4x4-FAILED: not every rank validated -- $(grep -o 'VALIDATION .*' /tmp/out.txt | head -1)"; exit 1; }
              grep -q '"ranks_ok": 8' /tmp/out.txt \
                || { echo "NCCL-4x4-FAILED: fewer than 8 ranks validated"; exit 1; }
              # Must really be 8 ranks across 2 hosts, 4 each.
              grep -q '"world_size": 8' /tmp/out.txt || { echo "NCCL-4x4-FAILED: world_size != 8"; exit 1; }
              # Asserted on a field python computed, rather than counted in shell.
              grep -q '"n_hosts": 2' /tmp/out.txt \
                || { echo "NCCL-4x4-FAILED: ranks did not span 2 hosts -- $(grep -o 'TOPO .*' /tmp/out.txt | head -1)"; exit 1; }
              grep -q '"ranks_per_host"' /tmp/out.txt \
                || { echo "NCCL-4x4-FAILED: no topology reported"; exit 1; }
              # And it must have used NVLink, not fallen back to sockets.
              grep -q "via P2P/MNNVL" /tmp/out.txt || { echo "NCCL-4x4-FAILED: no P2P/MNNVL in the data path"; exit 1; }
              echo "NCCL-4x4-OK (8 ranks, 2 trays, multi-node NVLink)"
