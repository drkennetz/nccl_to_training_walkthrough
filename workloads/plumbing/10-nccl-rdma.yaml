# workloads/plumbing/10-nccl-rdma.yaml -- multi-node NCCL over RoCE, for HGX shapes.
#
# For clusters with IMEX_PATH=none (e.g. nearby-woodcock, BM.GPU.B300.8). Gates 07-09
# assert P2P/MNNVL and can only fail there: on HGX, NVLink ends at the node edge and
# node-to-node traffic is RDMA. This gate is 08's twin for that world -- 8 GPUs x 2
# nodes = 16 ranks, one torch.distributed communicator -- and it asserts the opposite
# transport: NET/IB in the data path, never NET/Socket.
#
# STATUS (2026-09-26): HAS NOT PASSED. Node-to-node RoCEv2 on nearby-woodcock does not
# deliver data at all -- the same failure (QPs connect, then RETRY_EXC_ERR / "remote process
# exited or there was a network error") reproduces OUTSIDE Kubernetes: host ib_write_bw, and the
# site's own nccl_run_allreduce.sbatch recipe under plain Slurm, on five node pairs, while IPv6
# between the rail addresses works. That is a fabric issue for the network owners, not this
# gate; evidence: ktlo-telemetry-lake reports/b300/. The pod plumbing below (devices, VFs,
# plugin load) was verified; the data path could not be. Re-run this before trusting it.
#
#   kubectl apply -f workloads/plumbing/10-nccl-rdma.yaml
#   kubectl wait --for=condition=complete job/nccl-rdma --timeout=1200s
#   kubectl logs job/nccl-rdma -l batch.kubernetes.io/job-completion-index=0
#
# HOW THE POD REACHES THE RAILS -- and why it is safe for the site health check.
# The B300s here are multiplanar (IMDS rdmaFabricData.planes=4): NCCL runs over the
# eight rdma_vf_rail0..7 VFs. The site's check_multiplanar_rdma_vf_routes requires
# those netdevs to stay in the HOST namespace; moving them into a pod (a dranet
# claim) is what drained three GB300 racks on 2026-09-24 (see CLAUDE.md). So:
#   - hostNetwork: true      the VFs are used in place, never moved;
#   - privileged + IPC_LOCK  an unprivileged host-network pod sees /dev/infiniband but
#                            fails ibv_open_device and NCCL silently falls back to
#                            sockets; IPC_LOCK lets it pin RDMA memory (same recipe
#                            as ktlo-tech's multi-node checks);
#   - NCCL_* from the site's own B300 multiplanar recipe
#     (/opt/oci-hpc/healthchecks/multi_node_active_healthcheck.py). Its NCCL_TOPO_FILE
#     (B300MP.xml) is NOT used: it exists on the controller but not on the B300 nodes
#     (they carry only GB300MP.xml), so NCCL detects the topology itself.
# THE NET PLUGIN IS REQUIRED. With core NCCL IB (NCCL_NET_PLUGIN=none) every QP died
# with RETRY_EXC_ERR (status=12, vendor err 129) even with correct rail pairing: the rail
# VFs are multiplanar (IMDS planes=4, each VF 4x200G) and only the Spectrum-X plugin
# ("spcx", shipped in the host's HPC-X) drives the planes. It is mounted read-only from
# the host -- the same library the site's own multi-node check loads -- and nothing is
# copied onto the node. hostPath type Directory: a host without it fails at mount time
# instead of silently falling back to a transport that cannot work here.
#
# REQUIRES DEVICE-PLUGIN MODE (requests limits: nvidia.com/gpu) and two GPU workers.
---
apiVersion: v1
kind: Service
metadata:
  name: nccl-rdma
spec:
  clusterIP: None
  selector: {app: nccl-rdma}
  ports:
    - {name: rendezvous, port: 29400}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nccl-rdma
  labels: {app: k8s-bootstrap-plumbing, gate: nccl-rdma}
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels: {app: nccl-rdma}
    spec:
      restartPolicy: Never
      subdomain: nccl-rdma
      runtimeClassName: nvidia
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        k8s-bootstrap.io/role: worker
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: nccl-rdma}
              topologyKey: kubernetes.io/hostname
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 64Gi}
        - name: infiniband
          hostPath: {path: /dev/infiniband, type: Directory}
        - name: spcx
          hostPath: {path: /opt/hpcx-v2.25.1-gcc-doca_ofed-ubuntu24.04-cuda13-x86_64/nccl_spectrum-x_plugin/lib, type: Directory}
      containers:
        - name: nccl
          image: nvcr.io/nvidia/pytorch:25.08-py3
          securityContext:
            privileged: true
            capabilities: {add: [IPC_LOCK]}
          resources:
            limits:
              nvidia.com/gpu: 8
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: infiniband, mountPath: /dev/infiniband}
            - {name: spcx, mountPath: /opt/ktlo-host/spcx, readOnly: true}
          env:
            - name: NODE_RANK
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: MASTER_ADDR, value: nccl-rdma-0.nccl-rdma}
            - {name: MASTER_PORT, value: "29400"}
            - {name: NCCL_DEBUG, value: INFO}
            - {name: NCCL_DEBUG_SUBSYS, value: "INIT,NET"}
            - {name: NCCL_NET_PLUGIN, value: spcx}
            - {name: NCCL_CUMEM_ENABLE, value: "1"}
            - {name: NCCL_WORK_FIFO_BYTES, value: "0"}
            - {name: NCCL_NET, value: IB}
            - {name: NCCL_IB_HCA, value: "=rdma_vf_rail0,rdma_vf_rail1,rdma_vf_rail2,rdma_vf_rail3,rdma_vf_rail4,rdma_vf_rail5,rdma_vf_rail6,rdma_vf_rail7"}
            - {name: NCCL_SOCKET_IFNAME, value: eth0}
            - {name: NCCL_IB_GID_INDEX, value: "3"}
            - {name: NCCL_IB_TC, value: "96"}
            - {name: NCCL_IB_SL, value: "0"}
            - {name: NCCL_IB_TIMEOUT, value: "16"}
            - {name: NCCL_IB_RETRY_CNT, value: "7"}
            - {name: NCCL_IB_QPS_PER_CONNECTION, value: "16"}
            - {name: NCCL_IB_SPLIT_DATA_ON_QPS, value: "0"}
            - {name: NCCL_IB_ADAPTIVE_ROUTING, value: "1"}
            - {name: NCCL_IGNORE_CPU_AFFINITY, value: "1"}
            # Each rail VF is its own isolated plane (the host puts each in its own VRF):
            # rail i on one node reaches ONLY rail i on the other. Cross-NIC pairing sends
            # traffic to a plane with no route and every QP dies with RETRY_EXC_ERR
            # (status=12, vendor err 129) -- observed on the first run of this gate.
            - {name: NCCL_CROSS_NIC, value: "0"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -o pipefail
              # Prepend, never replace: the image's own library path must survive.
              export LD_LIBRARY_PATH="/opt/ktlo-host/spcx${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
              echo "=== node_rank ${NODE_RANK} on ${NODE_NAME} ==="
              echo "GPUs visible : $(nvidia-smi -L | grep -c '^GPU')"
              echo "RDMA VFs     : $(ls /sys/class/infiniband/ | grep -c '^rdma_vf_rail')"
              echo "net plugin   : $(ls /opt/ktlo-host/spcx/libnccl-net-spcx.so 2>/dev/null || echo MISSING)"
              echo "/dev/shm     : $(df -h /dev/shm | tail -1 | awk '{print $2}')"
              echo

              cat > /tmp/ar.py <<'PY'
              import json, os, socket, time
              import torch, torch.distributed as dist

              local = int(os.environ["LOCAL_RANK"])
              torch.cuda.set_device(local)
              dist.init_process_group("nccl")
              rank, world = dist.get_rank(), dist.get_world_size()

              # Who is where: proves the communicator really spans two machines.
              me = {"rank": rank, "local_rank": local, "host": socket.gethostname(),
                    "gpu": torch.cuda.get_device_name(local)}
              everyone = [None] * world
              dist.all_gather_object(everyone, me)

              # 512MiB of bf16 per rank.
              n = 512 * 1024 * 1024 // 2
              x = torch.ones(n, dtype=torch.bfloat16, device="cuda")
              for _ in range(5):
                  dist.all_reduce(x)
              torch.cuda.synchronize(); dist.barrier()

              iters = 20
              t0 = time.perf_counter()
              for _ in range(iters):
                  dist.all_reduce(x)
              torch.cuda.synchronize()
              dt = (time.perf_counter() - t0) / iters

              nbytes = x.numel() * x.element_size()
              busbw = nbytes * 2 * (world - 1) / world / dt / 1e9

              # Correctness on a FRESH tensor: x has been summed in place 25 times by now.
              y = torch.ones(4096, dtype=torch.bfloat16, device="cuda")
              dist.all_reduce(y)
              ok = bool(torch.all(y == world).item())

              # Aggregate over every rank: each pod's torchrun only sees its own ranks' stdout.
              flags = [None] * world
              dist.all_gather_object(flags, ok)
              all_ok = all(bool(f) for f in flags)

              if rank == 0:
                  hosts = sorted({e["host"] for e in everyone})
                  print("TOPO " + json.dumps({
                      "world_size": world,
                      "n_hosts": len(hosts),
                      "hosts": hosts,
                      "ranks_per_host": {h: sum(1 for e in everyone if e["host"] == h) for h in hosts},
                      "gpu": everyone[0]["gpu"],
                  }), flush=True)
                  print("PERF " + json.dumps({
                      "bytes_per_rank": nbytes,
                      "seconds": round(dt, 6),
                      "algbw_GBs": round(nbytes / dt / 1e9, 2),
                      "busbw_GBs": round(busbw, 2),
                  }), flush=True)
                  print("VALIDATION " + json.dumps({
                      "ranks_ok": sum(1 for f in flags if f),
                      "world_size": world,
                      "all_ok": all_ok,
                  }), flush=True)
              print("RANK%d correct=%s host=%s local_rank=%d" % (rank, ok, me["host"], local), flush=True)
              dist.destroy_process_group()
              PY

              torchrun \
                --nnodes=2 --nproc_per_node=8 --node_rank="${NODE_RANK}" \
                --master_addr="${MASTER_ADDR}" --master_port="${MASTER_PORT}" \
                /tmp/ar.py 2>&1 | tee /tmp/out.txt
              rc=$?

              if [ "${NODE_RANK}" != "0" ]; then
                [ "$rc" = 0 ] && { echo "NODE1-OK"; exit 0; } || { echo "NODE1-FAILED"; exit 1; }
              fi

              echo
              echo "=== transport NCCL chose ==="
              grep -oE "nRanks [0-9]+ nNodes [0-9]+ localRanks [0-9]+" /tmp/out.txt | sort -u | head -2 | sed 's/^/  /'
              echo "  NET/IB channels        : $(grep -c 'via NET/IB' /tmp/out.txt || true)"
              echo "  NET/Socket in data path: $(grep -c 'via NET/Socket' /tmp/out.txt || true)"
              echo "  IB devices in use      : $(grep -oE 'rdma_vf_rail[0-9]+' /tmp/out.txt | sort -u | paste -sd' ')"

              [ "$rc" = 0 ] || { echo "NCCL-RDMA-FAILED: torchrun exited ${rc}"; exit 1; }
              grep -q '"all_ok": true' /tmp/out.txt \
                || { echo "NCCL-RDMA-FAILED: not every rank validated -- $(grep -o 'VALIDATION .*' /tmp/out.txt | head -1)"; exit 1; }
              grep -q '"ranks_ok": 16' /tmp/out.txt || { echo "NCCL-RDMA-FAILED: fewer than 16 ranks validated"; exit 1; }
              grep -q '"n_hosts": 2' /tmp/out.txt \
                || { echo "NCCL-RDMA-FAILED: ranks did not span 2 hosts -- $(grep -o 'TOPO .*' /tmp/out.txt | head -1)"; exit 1; }
              # The point of the gate: real RDMA between the nodes, not a socket fallback.
              grep -q "via NET/IB" /tmp/out.txt || { echo "NCCL-RDMA-FAILED: no NET/IB in the data path"; exit 1; }
              if grep -q "via NET/Socket" /tmp/out.txt; then echo "NCCL-RDMA-FAILED: NET/Socket in the data path"; exit 1; fi
              echo "NCCL-RDMA-OK (16 ranks, 2 nodes, RoCE)"
